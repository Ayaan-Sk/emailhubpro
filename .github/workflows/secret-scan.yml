name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          ARCHIVE_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$ARCHIVE_URL" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Fetch branch, tag, and pull-request history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch --force origin             '+refs/heads/*:refs/remotes/origin/*'             '+refs/tags/*:refs/tags/*'             '+refs/pull/*/head:refs/remotes/pull/*'
      - name: Scan all fetched history with fully redacted output
        run: |
          set -euo pipefail
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          touch "$RUNNER_TEMP/empty-gitleaksignore"
          set +e
          "$RUNNER_TEMP/gitleaks" git .             --config "$RUNNER_TEMP/gitleaks.toml"             --gitleaks-ignore-path "$RUNNER_TEMP/empty-gitleaksignore"             --ignore-gitleaks-allow             --log-opts="--all --full-history"             --max-decode-depth=2             --redact=100 --no-banner --no-color \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json"
          scan_status=$?
          set -e
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"gitleaks-report.json"; rows=json.loads(p.read_text()) if p.exists() else []; [print(json.dumps({k:r.get(k) for k in ("RuleID","File","StartLine","Commit")})) for r in rows]'
          exit "$scan_status"
